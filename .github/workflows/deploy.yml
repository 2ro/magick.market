name: Deploy magick.market

# Deploys the live site at https://magick.market.
#
# The app is served by Bun directly from source: the systemd unit
# `magick-market.service` runs `bun src/index.tsx` from /opt/goblin/magick,
# and Bun bundles the frontend (index.html -> React/TSX + Tailwind CSS) at
# runtime. There is therefore no build/dist step — we ship the source tree and
# let the service bundle on start.
#
# Runtime env lives in /opt/goblin/magick/.env on the server and is NEVER
# touched by this workflow.

on:
  workflow_run:
    workflows:
      - E2E Tests
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-magick-market
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to magick.market
    # Run for a manual dispatch, or when the E2E Tests workflow succeeds on a
    # push to master.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # The deploy box is reachable only over the tailnet (public SSH port
      # closed 2026-07-15). Join the tailnet as an ephemeral tagged node so the
      # SSH/SCP steps below can dial DEPLOY_HOST (its 100.x tailnet address).
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Stage deployment files on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            rm -rf /tmp/magick-deploy
            mkdir -p /tmp/magick-deploy

      - name: Upload source to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: 'src,contextvm,package.json,bun.lock,tsconfig.json'
          target: '/tmp/magick-deploy'

      - name: Install deps, restart service, and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.bun/bin:$PATH"

            APP_DIR="/opt/goblin/magick"
            SRC="/tmp/magick-deploy"
            # The exact commit this run deployed — same resolution as the
            # checkout step above (workflow_run ships head_sha, dispatch HEAD).
            DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

            # Sync the code into place. --delete keeps src/ and contextvm/ free of
            # stale files, while leaving .env, node_modules and dist untouched
            # (they live at the app root, not inside these subdirectories).
            rsync -a --delete "$SRC/src/" "$APP_DIR/src/"
            rsync -a --delete "$SRC/contextvm/" "$APP_DIR/contextvm/"
            cp "$SRC/package.json" "$SRC/bun.lock" "$SRC/tsconfig.json" "$APP_DIR/"

            # rsync updates the files but leaves git HEAD behind, so `git status`
            # in the app dir shows phantom drift. Pin the checkout to the exact
            # commit this run deployed, fetched from GitHub by URL, so it never
            # depends on the server's origin remote or mirror state.
            git -C "$APP_DIR" fetch --quiet https://github.com/2ro/magick.market.git "$DEPLOY_SHA" && git -C "$APP_DIR" reset --hard "$DEPLOY_SHA"

            # The service bundles the frontend at runtime and needs the full
            # dependency set — including devDependencies such as tailwindcss and
            # tailwindcss-animate, which bun-plugin-tailwind uses to compile the
            # CSS on serve. So this is a full install, NOT --production.
            cd "$APP_DIR"
            bun install --frozen-lockfile

            # Build the NIP-49 unlock worker asset (public/nip49.worker.js).
            # The systemd unit runs `bun src/index.tsx` directly, not the `start`
            # script, so the worker must be built here or off-thread login decrypt
            # falls back to the main-thread path.
            bun run build:worker

            systemctl restart magick-market

            # Verify the unit is up and the app answers.
            systemctl is-active magick-market
            for i in $(seq 1 15); do
              if curl -sf https://magick.market/api/config >/dev/null; then
                echo "magick.market is live"
                exit 0
              fi
              sleep 2
            done
            echo "::error::magick.market did not become healthy after restart"
            exit 1
